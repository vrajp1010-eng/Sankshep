<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <defs>
    <linearGradient id="cubeGrad" x1="20" y1="20" x2="180" y2="180" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00f0ff" />
      <stop offset="50%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>
    <linearGradient id="pageGrad1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#e0f2fe" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
    <linearGradient id="pageGrad2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#7dd3fc" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Isometric Neural Cube Lattice -->
  <g stroke="url(#cubeGrad)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)">
    <!-- Bottom diamond -->
    <path d="M50 120 L95 145 L140 120 L95 95 Z" opacity="0.6" fill="rgba(0, 240, 255, 0.03)" />
    <!-- Top diamond -->
    <path d="M50 75 L95 100 L140 75 L95 50 Z" opacity="0.8" fill="rgba(99, 102, 241, 0.05)" />
    <!-- Vertical pillars -->
    <line x1="50" y1="75" x2="50" y2="120" />
    <line x1="95" y1="100" x2="95" y2="145" />
    <line x1="140" y1="75" x2="140" y2="120" />
    <!-- Internal cross diagonal lattices -->
    <line x1="50" y1="75" x2="95" y2="145" opacity="0.5" stroke-dasharray="3 3" />
    <line x1="95" y1="50" x2="140" y2="120" opacity="0.5" stroke-dasharray="3 3" />
    <line x1="50" y1="120" x2="95" y2="100" opacity="0.7" />
    <line x1="95" y1="100" x2="140" y2="120" opacity="0.7" />
    <line x1="72" y1="87" x2="117" y2="110" opacity="0.5" />
    
    <!-- Node vertices -->
    <circle cx="50" cy="75" r="4.5" fill="#00f0ff" />
    <circle cx="95" cy="50" r="4.5" fill="#38bdf8" />
    <circle cx="140" cy="75" r="4.5" fill="#818cf8" />
    <circle cx="95" cy="100" r="4.5" fill="#00f0ff" />
    <circle cx="50" cy="120" r="4.5" fill="#0284c7" />
    <circle cx="95" cy="145" r="4.5" fill="#4f46e5" />
    <circle cx="140" cy="120" r="4.5" fill="#6366f1" />
  </g>

  <!-- Flowing Dynamic Pages Emergence -->
  <g filter="url(#glow)">
    <!-- Central ribbon wave flow -->
    <path d="M95 100 Q115 75 145 65 T175 35" fill="none" stroke="url(#pageGrad1)" stroke-width="4" stroke-linecap="round" />
    
    <!-- Floating Page 1 -->
    <path d="M125 50 C135 40 145 42 155 48 C150 62 140 68 130 65 Z" fill="url(#pageGrad1)" opacity="0.95" stroke="#00f0ff" stroke-width="1" />
    
    <!-- Floating Page 2 -->
    <path d="M145 25 C158 18 168 22 172 32 C165 42 152 44 142 38 Z" fill="url(#pageGrad2)" opacity="0.9" stroke="#38bdf8" stroke-width="1" />
    
    <!-- Floating Page 3 (Top right) -->
    <path d="M160 55 C170 48 180 50 185 60 C178 70 166 72 156 65 Z" fill="url(#pageGrad1)" opacity="0.85" stroke="#7dd3fc" stroke-width="1" />
    
    <!-- Floating Page 4 (Small particle) -->
    <path d="M110 35 C118 28 126 30 130 38 C124 45 116 45 108 40 Z" fill="#e0f2fe" opacity="0.75" />
  </g>
</svg>
